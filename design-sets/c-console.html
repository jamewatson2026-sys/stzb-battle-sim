<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>战演终端 · 引擎外观方案 C</title>
<!--
  Huashu · pre-emit: P4 H5 E4 S4 R4 V4
  Huashu · slop-test: 12/12 ✓
  方案 C —— 战演终端（Telemetry Console）
  命题：把引擎当成一台可以观测的战斗机 —— 战局是数据流，界面是仪表盘。
  骨架：指标条 / 三栏仪表（阵容仪表 · 回合轨道与事件流 / 伤害构成） / 底部传输控制
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05080d;
  --bg-2:#080d14;
  --panel:#0a1018;
  --panel-2:#0c141d;
  --line:rgba(116,168,206,.16);
  --line-2:rgba(116,168,206,.30);
  --txt:#d5e3ee;
  --txt-2:#8fa6ba;
  --txt-3:#5b7183;
  --cyan:#49cfe0;
  --cyan-2:#8ff1ff;
  --amber:#efa63c;
  --red:#ff6152;
  --red-2:#ff9a8f;
  --blue:#6a9fe0;
  --green:#48d397;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 50% -8%,rgba(73,207,224,.10),transparent 70%),
    radial-gradient(40% 34% at 88% 6%,rgba(239,166,60,.07),transparent 70%),
    linear-gradient(180deg,#070c12,#04070b 70%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(116,168,206,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(116,168,206,.055) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent 92%);
  -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent 92%);
}
.app{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}

/* ── 顶栏 ── */
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;height:58px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,16,24,.9),rgba(5,8,13,.4))}
.wm{display:flex;align-items:center;gap:12px}
.wm .cube{width:26px;height:26px;border:1px solid var(--cyan);position:relative;display:grid;place-items:center;color:var(--cyan);font-family:var(--mono);font-size:12px;letter-spacing:0}
.wm .cube::after{content:"";position:absolute;inset:3px;border:1px solid rgba(73,207,224,.28)}
.wm h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.24em}
.wm .ver{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--txt-3);border:1px solid var(--line);padding:2px 6px}
.hd-note{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--txt-3);display:flex;gap:18px;align-items:center}
.hd-note b{color:var(--txt-2);font-weight:400}
.hd-note .dot{width:5px;height:5px;background:var(--green);box-shadow:0 0 8px var(--green);border-radius:50%}
.hd-nav{display:flex;gap:2px}
.hd-nav button{background:none;border:1px solid transparent;color:var(--txt-3);font-family:var(--mono);font-size:10px;letter-spacing:.16em;padding:6px 11px;cursor:pointer;transition:.2s var(--ease)}
.hd-nav button:hover{color:var(--cyan);border-color:var(--line-2)}
.hd-nav button.on{color:var(--cyan);border-color:rgba(73,207,224,.4);background:rgba(73,207,224,.06)}

/* ── 指标条 ── */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.kpi{position:relative;padding:13px 16px 12px;border-right:1px solid var(--line);overflow:hidden}
.kpi:last-child{border-right:0}
.kpi .lab{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--txt-3);display:flex;justify-content:space-between}
.kpi .lab i{font-style:normal;color:var(--txt-3)}
.kpi .val{font-family:var(--mono);font-size:27px;font-weight:300;letter-spacing:.01em;line-height:1.1;margin-top:5px;display:flex;align-items:baseline;gap:7px}
.kpi .val small{font-family:var(--sans);font-size:10px;color:var(--txt-3);letter-spacing:.1em;font-weight:300}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;height:26px;opacity:.55}
.kpi.acc .val{color:var(--cyan)}
.kpi.warn .val{color:var(--amber)}

/* ── 三栏 ── */
.body{display:grid;grid-template-columns:296px minmax(0,1fr) 336px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col.l{border-right:1px solid var(--line)}
.col.r{border-left:1px solid var(--line);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(116,168,206,.25) transparent}
.col.r::-webkit-scrollbar{width:5px}
.col.r::-webkit-scrollbar-thumb{background:rgba(116,168,206,.25)}
.sec{padding:9px 14px 7px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex:none}
.sec h2{margin:0;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.26em;color:var(--txt-2);text-transform:uppercase}
.sec h2 em{font-style:normal;color:var(--cyan);margin-right:8px}
.sec .r{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--txt-3)}

/* 阵容 */
.team{padding:8px 12px 4px;flex:none}
.tlab{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--txt-3);display:flex;align-items:center;gap:8px;margin:5px 2px 5px}
.tlab.red b{color:var(--red-2);font-weight:400}
.tlab.blue b{color:var(--blue);font-weight:400}
.tlab i{flex:1;height:1px;background:var(--line)}
.u{display:grid;grid-template-columns:30px 1fr 66px;gap:8px;align-items:center;padding:6px;border:1px solid transparent;cursor:pointer;transition:.18s var(--ease)}
.u:hover{background:rgba(73,207,224,.045);border-color:var(--line)}
.u.on{background:rgba(73,207,224,.07);border-color:rgba(73,207,224,.32)}
.u img{width:30px;height:30px;object-fit:cover;object-position:50% 12%;border:1px solid var(--line-2);filter:saturate(.7)}
.u .n{display:flex;align-items:baseline;gap:6px}
.u .n b{font-size:12.5px;font-weight:500;letter-spacing:.06em}
.u .n span{font-family:var(--mono);font-size:8.5px;color:var(--txt-3);letter-spacing:.08em}
.u .hp{margin-top:4px;height:3px;background:rgba(116,168,206,.12);position:relative;display:flex}
.u .hp i{height:100%;display:block}
.u .hp .t{background:linear-gradient(90deg,#2d7f8c,#49cfe0)}
.u .hp .w{background:rgba(239,166,60,.55)}
.u .hp .d{background:rgba(255,97,82,.55)}
.u .v{text-align:right;font-family:var(--mono);font-size:12px;color:var(--txt)}
.u .v small{display:block;font-size:8px;color:var(--txt-3);letter-spacing:.06em;margin-top:2px}
.u.dead{opacity:.42}
.u.dead .v{color:var(--red)}

/* 中央 回合轨道 */
.trackwrap{padding:10px 14px 6px;flex:none;border-bottom:1px solid var(--line);position:relative}
.trackwrap::before{content:"";position:absolute;left:14px;right:14px;bottom:30px;height:1px;background:var(--line)}
.track{display:flex;gap:5px;align-items:flex-end;height:86px}
.rcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;position:relative;group:none}
.rcol .bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;min-height:0}
.rcol .bars i{flex:none;width:9px;transition:height .5s var(--ease),opacity .3s;opacity:.6;border-radius:1px 1px 0 0}
.rcol .bars i.a{background:linear-gradient(180deg,var(--red),rgba(255,97,82,.15))}
.rcol .bars i.b{background:linear-gradient(180deg,var(--blue),rgba(106,159,224,.15))}
.rcol .lb{font-family:var(--mono);font-size:9px;color:var(--txt-3);text-align:center;padding-top:5px;letter-spacing:.1em}
.rcol .sm{font-family:var(--mono);font-size:7.5px;color:var(--txt-3);text-align:center;transition:.2s var(--ease);letter-spacing:.02em;margin-top:1px}
.rcol.on .sm{color:var(--cyan)}
.rcol:hover .bars i{opacity:.9}
.rcol.on .bars i{opacity:1}
.rcol.on .lb{color:var(--cyan)}
.rcol.on::before{content:"";position:absolute;inset:-4px -2px 16px;border:1px solid rgba(73,207,224,.35);background:rgba(73,207,224,.05);pointer-events:none}
.rcol.dim .bars i{opacity:.34}

/* 回合摘要 */
.rsum{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);flex:none}
.rsum div{padding:8px 12px;border-right:1px solid var(--line)}
.rsum div:last-child{border-right:0}
.rsum span{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--txt-3);display:block}
.rsum b{font-family:var(--mono);font-size:14px;font-weight:300;letter-spacing:.01em;display:block;margin-top:3px}
.rsum .r b{color:var(--red-2)}
.rsum .b b{color:var(--blue)}
.rsum .g b{color:var(--green)}
.rsum .a b{color:var(--amber)}

/* 事件表 */
.evwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.ev{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(116,168,206,.3) transparent;padding-bottom:6px}
.ev::-webkit-scrollbar{width:6px}
.ev::-webkit-scrollbar-thumb{background:rgba(116,168,206,.28)}
.erow{display:grid;grid-template-columns:46px 92px auto 1fr 118px 70px;gap:10px;align-items:center;padding:5px 14px;font-size:12px;border-bottom:1px solid rgba(116,168,206,.07);position:relative;cursor:default}
.erow:hover{background:rgba(73,207,224,.05)}
.erow.head{position:sticky;top:0;background:var(--bg-2);z-index:2;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--txt-3);border-bottom:1px solid var(--line);padding-top:6px;padding-bottom:6px}
.erow .lead{height:1px;align-self:center;margin:0 13px;background-image:linear-gradient(90deg,rgba(116,168,206,.42) 0 1px,transparent 1px 4px);background-size:4px 1px;opacity:.85}
.erow:hover .lead{opacity:1;background-image:linear-gradient(90deg,rgba(73,207,224,.55) 0 2px,transparent 2px 5px)}
.erow .t{font-family:var(--mono);font-size:10px;color:var(--txt-3);letter-spacing:.02em}
.erow .who{font-size:11.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.erow .who i{width:4px;height:4px;border-radius:50%;flex:none}
.erow .who i.rd{background:var(--red)}
.erow .who i.bl{background:var(--blue)}
.erow .who.rd{color:#e8c3bc}
.erow .who.bl{color:#bcd2ee}
.erow .act{color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.erow .act b{font-weight:400;color:var(--cyan-2)}
.erow .act .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--txt-3);border:1px solid var(--line-2);padding:0 4px;margin-right:6px}
.erow .tgt{color:var(--txt-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .vv{text-align:right;font-family:var(--mono);font-size:12.5px}
.erow .vv.neg{color:var(--red-2)}
.erow .vv.pos{color:var(--green)}
.erow .vv.mut{color:var(--txt-3);font-size:10px}
.erow.sep{grid-template-columns:1fr;font-family:var(--mono);font-size:8.5px;letter-spacing:.28em;color:var(--cyan);padding:7px 14px 5px;background:rgba(73,207,224,.04);border-bottom:1px solid var(--line);cursor:pointer}
.erow.sep:hover{background:rgba(73,207,224,.09)}

/* 右栏 */
.rsec{padding:10px 14px 8px;border-bottom:1px solid var(--line);flex:none}
.rsec h3{margin:0 0 6px;font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.22em;color:var(--txt-3);display:flex;justify-content:space-between}
.rsec h3 b{color:var(--txt-2);font-weight:400}
.stack svg{width:100%;height:88px;display:block}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--txt-3);margin-top:4px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-1px}
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{width:104px;height:104px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-family:var(--mono);font-size:15px;font-weight:300;color:var(--txt);display:block;line-height:1}
.donut .mid span{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:var(--txt-3)}
.dleg{flex:1;display:flex;flex-direction:column;gap:5px}
.dleg .r{display:grid;grid-template-columns:8px 1fr 52px 38px;gap:7px;align-items:center;font-size:10.5px;color:var(--txt-2)}
.dleg .r i{width:8px;height:8px;display:block}
.dleg .r b{font-family:var(--mono);font-size:10.5px;color:var(--txt);font-weight:400;text-align:right}
.dleg .r em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--txt-3);text-align:right}
.topsk{display:flex;flex-direction:column;gap:0}
.topsk .r{display:grid;grid-template-columns:1fr 88px;gap:8px;padding:4px 0;border-bottom:1px solid rgba(116,168,206,.08);font-size:11px}
.topsk .r .nm{color:var(--txt);display:flex;flex-direction:column;gap:3px}
.topsk .r .nm span{font-family:var(--mono);font-size:8px;color:var(--txt-3);letter-spacing:.1em}
.topsk .r .nm .b{height:2px;background:rgba(116,168,206,.14)}
.topsk .r .nm .b i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),rgba(73,207,224,.2))}
.topsk .r .v{font-family:var(--mono);font-size:11px;text-align:right;color:var(--txt-2)}

/* 热力 */
.heat{display:grid;grid-template-columns:52px repeat(8,1fr);gap:2px;align-items:center}
.heat .hl{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--txt-3);white-space:nowrap}
.heat .hc{height:11px;background:rgba(116,168,206,.07);position:relative}
.heat .hc i{position:absolute;inset:0;background:var(--cyan);opacity:0}
.heat .hh{font-family:var(--mono);font-size:7.5px;color:var(--txt-3);text-align:center}

/* 页脚 */
.ft{display:flex;align-items:center;gap:18px;padding:0 22px;height:62px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(10,16,24,.9),rgba(5,8,13,.3))}
.trans{display:flex;gap:6px}
.trans button{width:32px;height:32px;border:1px solid var(--line-2);background:none;color:var(--txt-2);cursor:pointer;display:grid;place-items:center;transition:.2s var(--ease)}
.trans button:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(73,207,224,.08)}
.trans button.main{width:38px;border-color:rgba(73,207,224,.5);color:var(--cyan)}
.scrub{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.scrub .bar{flex:1;height:22px;position:relative;cursor:pointer}
.scrub .bar .rail{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line-2)}
.scrub .bar .fill{position:absolute;left:0;top:10px;height:1px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.scrub .bar .tick{position:absolute;top:4px;width:1px;height:13px;background:rgba(116,168,206,.4)}
.scrub .bar .head{position:absolute;top:5px;width:2px;height:11px;background:var(--cyan-2);box-shadow:0 0 10px var(--cyan)}
.scrub .rd{font-family:var(--mono);font-size:10px;color:var(--txt-3);letter-spacing:.12em;white-space:nowrap}
.scrub .rd b{color:var(--cyan);font-weight:400}
.ft .meta{display:flex;gap:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--txt-3)}
.ft .meta b{color:var(--txt-2);font-weight:400}

@media (min-width:1700px){
  .body{grid-template-columns:330px 1fr 392px}
  .erow{grid-template-columns:54px 108px auto 1fr 148px 94px;font-size:12.5px;padding:5.5px 16px}
  .erow .t{font-size:10.5px}
  .erow .who{font-size:12px}
  .kpi .val{font-size:30px}
  .kpi .lab{font-size:10px}
  .u img{width:36px;height:36px}
  .u .nm{font-size:13px}
  .rsum b{font-size:15px}
  .sec h2{font-size:12.5px}
  .track{height:92px}
  .stack svg{height:104px}
  .topsk .r{padding:5px 0}
}

@media (max-height:840px){
  .hd{height:52px}
  .kpi{padding:9px 12px 8px}
  .kpi .val{font-size:22px}
  .kpi .spark{height:20px}
  .sec{padding:7px 12px 6px}
  .track{height:70px}
  .trackwrap{padding:8px 12px 4px}
  .trackwrap::before{bottom:26px}
  .erow{padding:4px 12px}
  .rsum div{padding:6px 10px}
  .rsum b{font-size:12px}
  .rsec{padding:8px 12px 6px}
  .stack svg{height:64px}
  .donut{width:86px;height:86px}
  .topsk .r:nth-child(n+5){display:none}
  .heat .hc{height:9px}
  .ft{height:54px}
}

/* tip */
.tip{position:fixed;z-index:30;display:none;background:rgba(8,13,20,.97);border:1px solid var(--line-2);padding:8px 10px;font-family:var(--mono);font-size:10px;line-height:1.75;color:var(--txt-2);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tip.on{display:block}
.tip b{color:var(--cyan-2);font-weight:400}
.tip .r{display:flex;justify-content:space-between;gap:16px}
</style>
</head>
<body>
<div class="app">

  <header class="hd">
    <div class="wm">
      <div class="cube">∎</div>
      <h1>战演终端</h1>
      <span class="ver">STZB·ENGINE 1.13</span>
    </div>
    <div class="hd-note">
      <span class="dot"></span><b>REPLAY</b>
      <span>SEED <b>2468</b></span>
      <span>MORALE <b>120</b></span>
      <span>ROUNDS <b>08</b></span>
      <span>RESULT <b id="resTag">DRAW</b></span>
    </div>
    <nav class="hd-nav">
      <button class="on">战报</button>
      <button>战法</button>
      <button>测算</button>
      <button>设置</button>
    </nav>
  </header>

  <section class="kpis" id="kpis"></section>

  <main class="body">
    <aside class="col l">
      <div class="sec"><h2><em>01</em>阵容 · ROSTER</h2><div class="r" id="rosterNote">6 UNITS</div></div>
      <div class="team" id="team"></div>
    </aside>

    <section class="col c">
      <div class="sec"><h2><em>02</em>回合轨道 · ROUND TRACK</h2><div class="r" id="trackNote">红方 / 蓝方 输出</div></div>
      <div class="trackwrap"><div class="track" id="track"></div></div>
      <div class="evwrap">
        <div class="rsum" id="rsum"></div>
        <div class="sec"><h2><em>03</em><span id="evTitle">事件流 · 第 01 回合</span></h2><div class="r">悬停查看伤害构成</div></div>
        <div class="ev" id="ev"></div>
      </div>
    </section>

    <aside class="col r">
      <div class="rsec stack">
        <h3>每回合输出 <b>DMG / ROUND</b></h3>
        <svg id="stack" viewBox="0 0 320 88" preserveAspectRatio="none"></svg>
        <div class="legend"><span><i style="background:#ff6152"></i>红方</span><span><i style="background:#6a9fe0"></i>蓝方</span><span><i style="background:#48d397"></i>恢复</span></div>
      </div>
      <div class="rsec">
        <h3>伤害构成 <b id="donutTotal">0</b></h3>
        <div class="donutwrap">
          <div class="donut">
            <svg id="donut" viewBox="0 0 120 120"></svg>
            <div class="mid"><b id="donutPct">0%</b><span>战法占比</span></div>
          </div>
          <div class="dleg" id="dleg"></div>
        </div>
      </div>
      <div class="rsec">
        <h3>战法杀伤 TOP <b>SKILL DMG</b></h3>
        <div class="topsk" id="topsk"></div>
      </div>
      <div class="rsec" style="border-bottom:0">
        <h3>事件密度 <b>EVENTS / ROUND</b></h3>
        <div class="heat" id="heat"></div>
      </div>
    </aside>
  </main>

  <footer class="ft">
    <div class="trans">
      <button id="prev" aria-label="上一回合"><svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M3 1h2v10H3zM10 1L5 6l5 5z"/></svg></button>
      <button id="play" class="main" aria-label="播放"><svg id="playIco" width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l9 5-9 5z"/></svg></button>
      <button id="next" aria-label="下一回合"><svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M7 1h2v10H7zM2 1l5 5-5 5z"/></svg></button>
    </div>
    <div class="scrub">
      <div class="rd">R <b id="curRound">01</b> / 08</div>
      <div class="bar" id="scrub"><div class="rail"></div><div class="fill" id="fill" style="width:0"></div><div class="head" id="head" style="left:0"></div></div>
      <div class="rd" id="scrubTick">--</div>
    </div>
    <div class="meta">
      <span>SEED <b>2468</b></span>
      <span>EVENTS <b id="evCount">0</b></span>
      <span>ENGINE <b>v1.13</b></span>
    </div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script src="./data/battle.js"></script>
<script>
(() => {
  const B = window.BATTLE, U = Object.fromEntries(B.units.map(u => [u.id, u]));
  const RED = B.units.filter(u => u.side === 'red'), BLUE = B.units.filter(u => u.side === 'blue');
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const nm = id => (U[id] ? U[id].name : '—');
  const pad = n => String(n).padStart(2, '0');
  const $ = s => document.querySelector(s);
  const DOT = { sorcery: '妖术', burning: '燃烧', panic: '恐慌', curse: '诅咒', ignite: '引燃', unrest: '逃兵' };
  const TROOP = { cavalry: '骑', archer: '弓', infantry: '步' };
  const RESULT = { win: 'WIN', loss: 'LOSS', draw: 'DRAW' };

  $('#resTag').textContent = RESULT[B.meta.result];
  $('#evCount').textContent = fmt(B.events.length);

  const ROUNDS = B.series.filter(s => s.round > 0).map(s => s.round);
  const dmgR = {}, dmgB = {}, healR = {}, healB = {}, castsR = {}, castsB = {};
  ROUNDS.forEach(r => { dmgR[r] = dmgB[r] = healR[r] = healB[r] = castsR[r] = castsB[r] = 0; });
  B.events.forEach(e => {
    const r = e.round; if (!(r in dmgR)) return;
    const sid = e.from || e.id; const u = U[sid];
    if (['damage','attack','dot','split'].includes(e.t) && u) {
      if (u.side === 'red') dmgR[r] += e.dmg || 0; else dmgB[r] += e.dmg || 0;
    }
    if (e.t === 'heal' && u) {
      if (u.side === 'red') healR[r] += e.amount || 0; else healB[r] += e.amount || 0;
    }
    if (e.t === 'cast' && u) { if (u.side === 'red') castsR[r]++; else castsB[r]++; }
  });

  // ── KPI ──
  const totalDmg = B.units.reduce((a, u) => a + u.agg.dealt, 0);
  const totalHeal = B.units.reduce((a, u) => a + u.agg.healed, 0);
  const totalWound = B.units.reduce((a, u) => a + u.wounded, 0);
  const totalDead = B.units.reduce((a, u) => a + u.dead, 0);
  const totalCasts = B.skillAgg.reduce((a, s) => a + (s.casts || 0), 0);
  const kpis = [
    { lab: '总输出', sub: 'TOTAL DMG', val: fmt(totalDmg), acc: 1, data: ROUNDS.map(r => dmgR[r] + dmgB[r]), col: '#49cfe0' },
    { lab: '总恢复', sub: 'HEAL', val: fmt(totalHeal), data: ROUNDS.map(r => healR[r] + healB[r]), col: '#48d397' },
    { lab: '战法发动', sub: 'CASTS', val: fmt(totalCasts), data: ROUNDS.map(r => castsR[r] + castsB[r]), col: '#efa63c' },
    { lab: '伤兵', sub: 'WOUNDED', val: fmt(totalWound), warn: 1, data: ROUNDS.map(() => totalWound / 8), col: '#efa63c' },
    { lab: '阵亡', sub: 'KIA', val: fmt(totalDead), warn: 1, data: ROUNDS.map(() => totalDead / 8), col: '#ff6152' },
    { lab: '事件', sub: 'EVENTS', val: fmt(B.events.length), data: ROUNDS.map(r => B.events.filter(e => e.round === r).length), col: '#6a9fe0' }
  ];
  const spark = (arr, col) => {
    const max = Math.max(...arr, 1), w = 100 / Math.max(1, arr.length - 1);
    const pts = arr.map((v, i) => `${(i * w).toFixed(1)},${(24 - v / max * 20).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.1" opacity=".8"/><polygon points="0,26 ${pts} 100,26" fill="${col}" opacity=".10"/></svg>`;
  };
  $('#kpis').innerHTML = kpis.map(k => `
    <div class="kpi ${k.acc ? 'acc' : ''} ${k.warn ? 'warn' : ''}">
      <div class="lab"><span>${k.lab}</span><i>${k.sub}</i></div>
      <div class="val">${k.val}</div>${spark(k.data, k.col)}
    </div>`).join('');

  // ── 阵容 ──
  function unitRow(u) {
    const total = Math.max(u.maxTroops, u.troops + u.wounded + u.dead);
    const p = v => (v / total * 100).toFixed(1) + '%';
    return `<div class="u ${u.side} ${u.troops <= 0 ? 'dead' : ''}" data-id="${u.id}" title="${u.name} · ${u.slot}">
      <img src="${u.avatar || u.portrait}" alt="">
      <div>
        <div class="n"><b>${u.name}</b><span>${u.slot} · ${TROOP[u.troopType] || ''} · ${u.redness}R</span></div>
        <div class="hp"><i class="t" style="width:${p(u.troops)}"></i><i class="w" style="width:${p(u.wounded)}"></i><i class="d" style="width:${p(u.dead)}"></i></div>
      </div>
      <div class="v">${fmt(u.troops)}<small>${fmt(u.agg.dealt)} DMG</small></div>
    </div>`;
  }
  $('#team').innerHTML = `<div class="tlab red"><b>红方</b><span>${B.meta.redName}</span><i></i></div>` + RED.map(unitRow).join('')
    + `<div class="tlab blue" style="margin-top:10px"><b>蓝方</b><span>${B.meta.blueName}</span><i></i></div>` + BLUE.map(unitRow).join('');

  // ── 回合轨道 ──
  const peak = Math.max(...ROUNDS.flatMap(r => [dmgR[r], dmgB[r]]), 1);
  const hh = v => Math.max(3, (v / peak) * 100);
  $('#track').innerHTML = ROUNDS.map(r => `
    <div class="rcol" data-r="${r}">
      <div class="bars"><i class="a" style="height:${hh(dmgR[r])}%"></i><i class="b" style="height:${hh(dmgB[r])}%"></i></div>
      <div class="lb">${pad(r)}</div><div class="sm">${(dmgR[r] + dmgB[r]) > 0 ? Math.round((dmgR[r] + dmgB[r]) / 100) / 10 + 'k' : '—'}</div>
    </div>`).join('');

  // ── 事件流 ──
  const KEEP = new Set(['cast','trigger','attack','damage','dot','split','heal','cover','evade','death','idle','expire','conflict']);
  function actCell(e) {
    switch (e.t) {
      case 'cast': return `<span class="k">CAST</span><b>${e.skill || ''}</b>`;
      case 'trigger': return `<span class="k">PROC</span>${e.skill || ''} <span style="color:var(--txt-3)">${e.rate ?? ''}%</span>`;
      case 'attack': return `<span class="k">HIT</span>普通攻击`;
      case 'damage': return `<span class="k">${e.kind === 'strategy' ? 'MAG' : 'PHY'}</span><b>${e.skill || '战法'}</b>`;
      case 'dot': return `<span class="k">DOT</span>${DOT[e.kind] || '持续'} · ${e.skill || ''}`;
      case 'split': return `<span class="k">SPL</span>分兵 · ${e.skill || ''}`;
      case 'heal': return `<span class="k">HEAL</span><b>${e.skill || '恢复'}</b>`;
      case 'cover': return `<span class="k">COVER</span>援护代受`;
      case 'evade': return `<span class="k">MISS</span>攻击被规避`;
      case 'death': return `<span class="k">KIA</span>武将阵亡`;
      case 'idle': return `<span class="k">IDLE</span>${e.reason || '无法行动'}`;
      case 'expire': return `<span class="k">END</span>状态结束`;
      case 'conflict': return `<span class="k">CONF</span>状态冲突`;
      default: return e.skill || e.t;
    }
  }
  function valCell(e) {
    if (e.t === 'heal') return `<span class="vv pos">+${fmt(e.amount)}</span>`;
    if (['damage','attack','dot','split'].includes(e.t)) return `<span class="vv neg">−${fmt(e.dmg)}</span>`;
    if (e.t === 'death') return `<span class="vv neg">KILL</span>`;
    return `<span class="vv mut">·</span>`;
  }
  function whoCell(id) {
    if (!U[id]) return '';
    const u = U[id];
    return `<span class="who ${u.side === 'blue' ? 'bl' : 'rd'}"><i class="${u.side === 'blue' ? 'bl' : 'rd'}"></i>${u.name}</span>`;
  }

  let curR = ROUNDS[0], filterUnit = null, playing = false, timer = null;

  function renderEv() {
    const list = B.events.filter(e => e.round === curR && KEEP.has(e.t))
      .filter(e => !filterUnit || e.from === filterUnit || e.id === filterUnit || e.to === filterUnit);
    let html = `<div class="erow head"><span>T</span><span>ACTOR</span><span>ACTION</span><span></span><span>TARGET</span><span style="text-align:right">VALUE</span></div>`;
    list.forEach((e, i) => {
      const idx = B.events.indexOf(e);
      html += `<div class="erow" data-i="${idx}">
        <span class="t">${curR}.${String(i + 1).padStart(3, '0')}</span>
        ${whoCell(e.from || e.id)}
        <span class="act">${actCell(e)}</span>
        <i class="lead"></i>
        <span class="tgt">${e.to ? nm(e.to) : '—'}</span>
        <span style="text-align:right">${valCell(e)}</span>
      </div>`;
    });
    if (!list.length) html += `<div style="padding:22px 14px;font-family:var(--mono);font-size:10px;color:var(--txt-3)">NO EVENTS UNDER CURRENT FILTER</div>`;
    $('#ev').innerHTML = html;
    const evs = B.events.filter(e => e.round === curR);
    const kia = evs.filter(e => e.t === 'death').length;
    $('#rsum').innerHTML = `
      <div class="r"><span>红方输出</span><b>${fmt(dmgR[curR])}</b></div>
      <div class="b"><span>蓝方输出</span><b>${fmt(dmgB[curR])}</b></div>
      <div class="g"><span>恢复</span><b>${fmt(healR[curR] + healB[curR])}</b></div>
      <div class="a"><span>战法发动</span><b>${castsR[curR] + castsB[curR]}</b></div>
      <div><span>阵亡</span><b>${kia}</b></div>`;
    $('#evTitle').textContent = `事件流 · 第 ${pad(curR)} 回合`;

  }

  function paint() {
    document.querySelectorAll('.rcol').forEach(c => {
      c.classList.toggle('on', +c.dataset.r === curR);
      c.classList.toggle('dim', +c.dataset.r > curR);
    });
    $('#curRound').textContent = pad(curR);
    const pct = (curR - 1) / (ROUNDS.length - 1) * 100;
    $('#fill').style.width = pct + '%';
    $('#head').style.left = `calc(${pct}% - 1px)`;
    $('#scrubTick').textContent = `DMG ${fmt(dmgR[curR] + dmgB[curR])}`;
    renderEv();
  }

  document.querySelectorAll('.rcol').forEach(c => c.addEventListener('click', () => { curR = +c.dataset.r; paint(); }));
  document.addEventListener('click', ev => {
    const u = ev.target.closest('.u');
    if (u) {
      filterUnit = filterUnit === u.dataset.id ? null : u.dataset.id;
      document.querySelectorAll('.u').forEach(x => x.classList.toggle('on', x.dataset.id === filterUnit));
      renderEv(); return;
    }
  });

  // ── 播放 ──
  const playIco = $('#playIco');
  const paintPlay = () => { playIco.innerHTML = playing ? '<rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/>' : '<path d="M2 1l9 5-9 5z"/>'; };
  function stop() { playing = false; clearTimeout(timer); paintPlay(); }
  function tick() { if (!playing) return; const i = ROUNDS.indexOf(curR); if (i >= ROUNDS.length - 1) { stop(); return; } curR = ROUNDS[i + 1]; paint(); timer = setTimeout(tick, 1500); }
  $('#play').addEventListener('click', () => { if (playing) stop(); else { playing = true; paintPlay(); tick(); } });
  $('#prev').addEventListener('click', () => { stop(); const i = ROUNDS.indexOf(curR); curR = ROUNDS[Math.max(0, i - 1)]; paint(); });
  $('#next').addEventListener('click', () => { stop(); const i = ROUNDS.indexOf(curR); curR = ROUNDS[Math.min(ROUNDS.length - 1, i + 1)]; paint(); });
  $('#scrub').addEventListener('click', ev => {
    const r = ev.currentTarget.getBoundingClientRect();
    const k = Math.min(ROUNDS.length - 1, Math.max(0, Math.round((ev.clientX - r.left) / r.width * (ROUNDS.length - 1))));
    stop(); curR = ROUNDS[k]; paint();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight') $('#next').click();
    if (ev.key === 'ArrowLeft') $('#prev').click();
    if (ev.key === ' ') { ev.preventDefault(); $('#play').click(); }
  });

  // ── 每回合输出（叠柱） ──
  (() => {
    const max = Math.max(...ROUNDS.flatMap(r => [dmgR[r] + healR[r], dmgB[r] + healB[r]]), 1);
    const bw = 320 / ROUNDS.length;
    let s = '';
    ROUNDS.forEach((r, i) => {
      const x = i * bw + bw * 0.22, w = bw * 0.56;
      const rh = (dmgR[r] / max) * 74, gh = (healR[r] / max) * 74;
      const bh = (dmgB[r] / max) * 74, g2 = (healB[r] / max) * 74;
      s += `<rect x="${(x - w / 2 - 3).toFixed(1)}" y="${(80 - rh).toFixed(1)}" width="${w.toFixed(1)}" height="${rh.toFixed(1)}" fill="#ff6152" opacity=".72"/>`;
      s += `<rect x="${(x - w / 2 - 3).toFixed(1)}" y="${(80 - rh - gh).toFixed(1)}" width="${w.toFixed(1)}" height="${gh.toFixed(1)}" fill="#48d397" opacity=".55"/>`;
      s += `<rect x="${(x + w / 2 + 3).toFixed(1)}" y="${(80 - bh).toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="#6a9fe0" opacity=".72"/>`;
      s += `<rect x="${(x + w / 2 + 3).toFixed(1)}" y="${(80 - bh - g2).toFixed(1)}" width="${w.toFixed(1)}" height="${g2.toFixed(1)}" fill="#48d397" opacity=".35"/>`;
      s += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="87" font-size="7" fill="#5b7183" text-anchor="middle" font-family="JetBrains Mono">${pad(r)}</text>`;
    });
    for (let k = 0; k <= 2; k++) s = `<line x1="0" y1="${8 + k * 36}" x2="320" y2="${8 + k * 36}" stroke="rgba(116,168,206,.12)"/>` + s;
    $('#stack').innerHTML = s;
  })();

  // ── 伤害构成 ──
  const cat = { basic: 0, skill: 0, dot: 0, split: 0 };
  B.events.forEach(e => {
    if (!['damage','attack','dot','split'].includes(e.t)) return;
    if (e.t === 'attack') cat.basic += e.dmg || 0;
    else if (e.t === 'split') cat.split += e.dmg || 0;
    else if (e.t === 'dot') cat.dot += e.dmg || 0;
    else cat.skill += e.dmg || 0;
  });
  const catSum = Math.max(1, cat.basic + cat.skill + cat.dot + cat.split);
  const CATS = [
    ['战法', cat.skill, '#49cfe0'], ['普攻', cat.basic, '#efa63c'],
    ['分兵', cat.split, '#6a9fe0'], ['持续', cat.dot, '#48d397']
  ];
  const C = 2 * Math.PI * 44;
  let off = 0;
  $('#donut').innerHTML = `<circle cx="60" cy="60" r="44" fill="none" stroke="rgba(116,168,206,.12)" stroke-width="9"/>` +
    CATS.map(([n, v, c]) => {
      const len = v / catSum * C;
      const seg = `<circle cx="60" cy="60" r="44" fill="none" stroke="${c}" stroke-width="9" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" opacity=".9"/>`;
      off += len; return seg;
    }).join('');
  $('#donutTotal').textContent = fmt(catSum);
  $('#donutPct').textContent = Math.round(cat.skill / catSum * 100) + '%';
  $('#dleg').innerHTML = CATS.map(([n, v, c]) => `
    <div class="r"><i style="background:${c}"></i><span>${n}</span><b>${fmt(v)}</b><em>${(v / catSum * 100).toFixed(1)}%</em></div>`).join('');

  // ── 战法 TOP ──
  const tops = [...B.skillAgg].filter(s => s.damage > 0).sort((a, b) => b.damage - a.damage).slice(0, 5);
  const tmax = Math.max(...tops.map(s => s.damage), 1);
  $('#topsk').innerHTML = tops.map(s => `
    <div class="r"><div class="nm">${s.name}<span>Casts ${s.casts || 0} · Trig ${s.triggers || 0}</span><div class="b"><i style="width:${(s.damage / tmax * 100).toFixed(1)}%"></i></div></div>
    <div class="v">${fmt(s.damage)}</div></div>`).join('');

  // ── 伤害构成浮层 ──
  const tip = $('#tip');
  $('#ev').addEventListener('mouseover', ev => {
    const row = ev.target.closest('.erow[data-i]');
    if (!row) return;
    const e = B.events[+row.dataset.i];
    if (!['damage','attack','dot','split'].includes(e.t)) { tip.classList.remove('on'); return; }
    const bd = e.bd || {};
    tip.innerHTML = `<div><b>${fmt(e.dmg)}</b> · ${e.skill || '普通攻击'} · ${e.kind || 'physical'}</div>` +
      [['troop', bd.troopBase], ['attr', bd.base], ['main', bd.main]].filter(x => x[1] != null)
        .map(([k, v]) => `<div class="r"><span>${k}</span><b>${v}</b></div>`).join('') +
      `<div class="r"><span>after</span><b>${e.after != null ? fmt(e.after) : '—'}</b></div>`;
    tip.classList.add('on');
  });
  $('#ev').addEventListener('mousemove', ev => {
    if (!tip.classList.contains('on')) return;
    let x = ev.clientX + 14, y = ev.clientY + 12;
    if (x + tip.offsetWidth > innerWidth - 10) x = ev.clientX - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > innerHeight - 10) y = ev.clientY - tip.offsetHeight - 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  $('#ev').addEventListener('mouseleave', () => tip.classList.remove('on'));

  // ── 事件密度热力 ──
  (() => {
    const CAT = [
      ['普攻', e => e.t === 'attack'],
      ['战法', e => e.t === 'damage'],
      ['持续', e => e.t === 'dot'],
      ['分兵', e => e.t === 'split'],
      ['恢复', e => e.t === 'heal'],
      ['控制', e => e.t === 'status' || e.t === 'conflict'],
    ];
    const counts = CAT.map(([n, f]) => [n, ROUNDS.map(r => B.events.filter(e => e.round === r && f(e)).length)]);
    const max = Math.max(...counts.flatMap(c => c[1]), 1);
    let h = `<span class="hh"></span>` + ROUNDS.map(r => `<span class="hh">${pad(r)}</span>`).join('');
    counts.forEach(([n, arr]) => {
      h += `<span class="hl">${n}</span>`;
      arr.forEach(v => { h += `<span class="hc" title="${n} · ${v}"><i style="opacity:${(v / max * 0.92).toFixed(2)}"></i></span>`; });
    });
    $('#heat').innerHTML = h;
  })();

  paint(); paintPlay();
  setTimeout(() => { if (!playing) { playing = true; paintPlay(); tick(); } }, 1200);
})();
</script>
</body>
</html>
