<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>战演录 · 引擎外观方案 A</title>
<!--
  Huashu · pre-emit: P4 H5 E4 S4 R4 V4
  Huashu · slop-test: 12/12 ✓
  方案 A —— 战演录（Cinematic Replay）
  命题：把「一次模拟」变成一部可以观看的战役。
  骨架：顶栏 / 左红右蓝对阵 / 中央碰撞区 + 出手序 + 兵力天平 / 底部回合年代轴 / 右侧实录抽屉
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#080605;
  --lacquer:#150f0c;
  --paper:#f2e8d4;
  --paper-dim:#cbb896;
  --muted:#9c8a71;
  --line:rgba(201,162,39,.24);
  --line-soft:rgba(214,190,150,.13);
  --gold:#c9a227;
  --gold-2:#ecd287;
  --gold-dim:#8a6d33;
  --crimson:#a8322c;
  --crimson-2:#e05a42;
  --teal:#5a9e93;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"SimSun",serif;
  --num:"Cormorant Garamond","Times New Roman",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(46% 42% at 50% 40%, rgba(176,118,44,.26), transparent 72%),
    radial-gradient(34% 56% at 6% 46%, rgba(140,44,34,.24), transparent 72%),
    radial-gradient(34% 56% at 94% 46%, rgba(34,60,100,.26), transparent 72%),
    radial-gradient(120% 90% at 50% 110%, rgba(90,52,20,.20), transparent 60%),
    linear-gradient(180deg,#0a0807 0%,#130e0b 52%,#080605 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.42;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.34'/></svg>");
  mix-blend-mode:overlay;
}
.map-lines{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
.map-lines svg{width:100%;height:100%}
.edge-word{
  position:fixed;z-index:2;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  font-size:11px;letter-spacing:.62em;color:rgba(201,162,39,.32);pointer-events:none;user-select:none;
}
.edge-word.l{left:12px}
.edge-word.r{right:12px}

/* ── 顶栏 ── */
.top{position:relative;z-index:5;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px;border-bottom:1px solid var(--line-soft)}
.top::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,39,.7),transparent)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,39,.3),transparent)}
.brand{display:flex;align-items:center;gap:15px}
.seal{
  width:46px;height:46px;flex:none;display:grid;place-items:center;position:relative;
  border:1px solid rgba(201,162,39,.65);color:var(--gold-2);font-weight:900;font-size:23px;
  background:radial-gradient(circle at 35% 28%,rgba(201,162,39,.22),rgba(201,162,39,.02) 70%);
  box-shadow:inset 0 0 0 3px #0c0807, inset 0 0 0 4px rgba(201,162,39,.30), 0 0 22px rgba(201,162,39,.14);
}
.brand-txt h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.4em;color:var(--paper)}
.brand-txt p{margin:6px 0 0;font-family:var(--num);font-size:10px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:4px}
.nav a{color:var(--paper-dim);text-decoration:none;font-size:13.5px;letter-spacing:.22em;padding:9px 16px;position:relative;transition:color .3s var(--ease)}
.nav a::before{content:"";position:absolute;inset:0;border:1px solid transparent;transition:.3s var(--ease)}
.nav a:hover{color:var(--gold-2)}
.nav a:hover::before{border-color:var(--line)}
.nav a.on{color:var(--gold-2)}
.nav a.on::before{border-color:rgba(201,162,39,.45);background:rgba(201,162,39,.07)}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:16px}
.engine-tag{font-family:var(--num);font-size:11px;letter-spacing:.26em;color:var(--muted);border:1px solid var(--line-soft);padding:6px 11px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-soft);background:none;color:var(--paper-dim);cursor:pointer;transition:.3s var(--ease)}
.icon-btn:hover{border-color:var(--gold-dim);color:var(--gold-2)}

/* ── 舞台 ── */
.stage{position:relative;z-index:3;height:calc(100vh - 76px - 112px);display:grid;grid-template-columns:322px minmax(300px,1fr) 322px;gap:30px;padding:20px 44px 8px;align-items:stretch}
.side{display:flex;flex-direction:column;gap:12px;position:relative;min-height:0}
.side-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line-soft);flex:none}
.side-head .who{font-size:15px;letter-spacing:.16em;color:var(--paper)}
.side-head .who em{font-style:normal;color:var(--gold-2);margin-right:9px;font-size:11px;letter-spacing:.34em}
.side-head .tag{font-size:10px;letter-spacing:.24em;color:var(--muted)}
.side.blue .side-head{flex-direction:row-reverse}
.side.blue .side-head .who{text-align:right}

.card{
  position:relative;flex:1;min-height:0;display:grid;grid-template-columns:112px 1fr;
  background:linear-gradient(100deg,rgba(44,32,24,.95) 0%,rgba(22,16,12,.96) 70%);
  border:1px solid rgba(201,162,39,.20);cursor:pointer;overflow:hidden;
  transition:border-color .45s var(--ease),transform .45s var(--ease),box-shadow .45s var(--ease);
}
.card::before,.card::after{content:"";position:absolute;width:13px;height:13px;z-index:3;pointer-events:none;opacity:.75}
.card::before{left:5px;top:5px;border-left:1px solid var(--gold);border-top:1px solid var(--gold)}
.card::after{right:5px;bottom:5px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.side.blue .card{grid-template-columns:1fr 112px;background:linear-gradient(260deg,rgba(44,32,24,.95) 0%,rgba(22,16,12,.96) 70%)}
.side.blue .card .pic{order:2}
.side.red .side-head{border-bottom-color:rgba(168,50,44,.38)}
.side.blue .side-head{border-bottom-color:rgba(78,111,158,.38)}
.side.red .side-head .who em{color:#d9765f}
.side.blue .side-head .who em{color:#96b2da}
.side.red .card{border-left-color:rgba(168,50,44,.45)}
.side.blue .card{border-right-color:rgba(78,111,158,.45)}
.card:hover{border-color:rgba(201,162,39,.6);transform:translateX(4px);box-shadow:-12px 0 40px rgba(201,162,39,.08)}
.side.blue .card:hover{transform:translateX(-4px);box-shadow:12px 0 40px rgba(201,162,39,.08)}
.card.dead{filter:grayscale(.9) brightness(.45)}
.card.active{border-color:rgba(236,210,135,.9);box-shadow:0 0 0 1px rgba(201,162,39,.3),0 0 44px rgba(201,162,39,.26),inset 0 0 60px rgba(201,162,39,.10)}
.card.active .pic img{filter:saturate(1) contrast(1.08) brightness(1.06)}
.card.hit{animation:hit .5s var(--ease)}
@keyframes hit{0%{transform:translateX(0)}18%{transform:translateX(-7px)}42%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.card .pic{position:relative;overflow:hidden;background:#100b09}
.card .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;filter:saturate(.75) contrast(1.04) brightness(.92);transition:filter .6s var(--ease)}
.card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,11,9,0) 42%,rgba(22,16,12,.82) 78%,rgba(22,16,12,.98) 100%)}
.side.blue .card .pic::after{background:linear-gradient(270deg,rgba(16,11,9,0) 42%,rgba(22,16,12,.82) 78%,rgba(22,16,12,.98) 100%)}
.card .body{padding:12px 13px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;position:relative;z-index:2}
.side.blue .card .body{text-align:right;align-items:flex-end}
.card .l1{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between}
.side.blue .card .l1{flex-direction:row-reverse}
.card .pos{font-size:10px;letter-spacing:.2em;color:var(--gold-dim);border:1px solid rgba(201,162,39,.28);padding:2.5px 6px;flex:none}
.card .fac{display:flex;align-items:center;gap:5px}
.card .fac img{width:22px;height:22px;opacity:.92}
.card .fac span{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.card .l2{display:flex;align-items:baseline;gap:7px;width:100%}
.side.blue .card .l2{flex-direction:row-reverse}
.card .l2 b{font-size:19px;font-weight:600;letter-spacing:.1em;color:var(--paper)}
.card .l2 i{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.card .l3{width:100%}
.card .perf{display:flex;gap:16px;justify-content:flex-start;white-space:nowrap;font-size:9px;letter-spacing:.16em;color:rgba(156,138,113,.8);border-top:1px solid rgba(214,190,150,.08);padding-top:7px;width:100%}
.side.blue .card .perf{justify-content:flex-end}
.card .perf b{font-family:var(--num);font-size:12.5px;font-weight:400;color:var(--paper-dim);margin-left:4px;letter-spacing:.02em}
.card .troops{display:flex;align-items:baseline;gap:6px;justify-content:flex-start;margin-bottom:5px}
.side.blue .card .troops{justify-content:flex-end}
.card .troops b{font-family:var(--num);font-size:27px;font-weight:500;line-height:.85;color:var(--paper);letter-spacing:.02em;transition:color .3s}
.card .troops span{font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.card .troops b.low{color:var(--crimson-2)}
.bar{height:4px;background:rgba(255,255,255,.08);display:flex;overflow:hidden}
.bar i{display:block;height:100%;transition:width .55s var(--ease)}
.bar .t{background:linear-gradient(90deg,#8a6d33,#e2c56a)}
.bar .w{background:#6b563a}
.bar .d{background:#4a2622}
.side.blue .card .bar{direction:rtl}
.card .cas{display:flex;gap:12px;justify-content:flex-start;margin-top:5px;font-size:9px;letter-spacing:.14em;color:rgba(156,138,113,.75)}
.side.blue .card .cas{justify-content:flex-end}
.card .cas b{font-family:var(--num);font-size:11px;font-weight:400;color:var(--paper-dim);letter-spacing:.04em;margin-left:3px}
.card .mini{display:flex;gap:5px;justify-content:flex-start;margin-top:6px;align-items:center}
.side.blue .card .mini{justify-content:flex-end}
.card .mini img{width:19px;height:19px;opacity:.8;filter:brightness(1.45) saturate(1.05)}
.card .red{display:inline-flex;gap:2.5px;align-items:center;margin-left:2px}
.card .red i{width:4px;height:4px;background:var(--crimson-2);transform:rotate(45deg);display:block}

.side-foot{display:flex;justify-content:space-between;align-items:baseline;padding-top:9px;border-top:1px solid var(--line-soft);flex:none}
.side-foot span{font-size:9.5px;letter-spacing:.24em;color:var(--muted)}
.side-foot b{font-family:var(--num);font-size:16px;font-weight:400;color:var(--paper-dim);letter-spacing:.04em}
.side.blue .side-foot{flex-direction:row-reverse}

/* ── 中央 ── */
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;gap:0}
.round-mark{text-align:center;padding-top:2px;flex:none}
.round-mark .k{font-family:var(--num);font-size:9.5px;letter-spacing:.6em;color:var(--muted);text-transform:uppercase}
.round-mark .v{font-size:25px;letter-spacing:.26em;color:var(--paper);margin-top:7px;font-weight:300}
.round-mark .v b{font-family:var(--num);font-size:38px;font-weight:400;color:var(--gold-2);letter-spacing:.04em;padding:0 2px}
.round-mark .sub{font-size:10px;color:var(--gold-dim);letter-spacing:.26em;margin-top:7px}

.order{display:flex;align-items:center;margin-top:28px;position:relative;flex:none}
.order .olabel{font-size:9px;letter-spacing:.34em;color:rgba(156,138,113,.66);margin-right:14px;white-space:nowrap}
.order .who{width:38px;height:38px;border-radius:50%;overflow:hidden;position:relative;margin:0 5px;flex:none;border:1px solid rgba(201,162,39,.22);transition:.4s var(--ease);filter:saturate(.6) brightness(.7)}
.order .who img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.order .who em{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);font-family:var(--num);font-size:9px;font-style:normal;color:var(--gold-2);background:rgba(8,6,5,.85);padding:0 4px;letter-spacing:.06em}
.order .who.on{filter:none;border-color:var(--gold-2);box-shadow:0 0 18px rgba(201,162,39,.45);transform:scale(1.14)}
.order .who.blue{border-color:rgba(78,111,158,.4)}
.order .who.blue em{color:#a9c3e6}
.order .arrowmark{width:12px;height:1px;background:rgba(201,162,39,.25);position:relative;flex:none}
.order .arrowmark::after{content:"";position:absolute;right:0;top:-1.5px;border-left:4px solid rgba(201,162,39,.45);border-top:2px solid transparent;border-bottom:2px solid transparent}

.clash{width:100%;max-width:560px;position:relative;flex:none;display:flex;flex-direction:column;justify-content:center;padding:24px 0 26px;min-height:0}
.rstat{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:9.5px;letter-spacing:.2em;color:rgba(156,138,113,.75);pointer-events:none}
.rstat b{font-family:var(--num);font-size:15px;font-weight:400;letter-spacing:.04em;color:var(--paper-dim);margin-left:6px}
.rstat b.r{color:#d9765f}
.rstat b.b{color:#96b2da}
.rstat i{font-style:normal;width:1px;height:9px;background:rgba(214,190,150,.2)}
.hist{display:none;position:absolute;left:0;right:0;top:15%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;pointer-events:none;padding:0 26px;height:88px;overflow:hidden;
  mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 42%,#000 100%);-webkit-mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 42%,#000 100%)}
.hist .h{font-size:11px;letter-spacing:.1em;color:rgba(203,184,150,.34);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:histin .55s var(--ease)}
.hist .h:last-child{color:rgba(226,205,168,.66)}
.hist .h:last-child::before{content:"›";margin-right:8px;color:var(--gold-dim)}
@keyframes histin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hist .h{font-size:11px;letter-spacing:.1em;color:rgba(203,184,150,.42);line-height:2.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:histin .6s var(--ease)}
.hist .h:first-child{color:rgba(203,184,150,.62)}
.hist .h:first-child::before{content:"·";margin-right:7px;color:var(--gold-dim)}
@keyframes histin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.clash::before{content:"";position:absolute;top:8%;bottom:8%;left:0;width:1px;background:linear-gradient(180deg,transparent,rgba(201,162,39,.22),transparent)}
.clash::after{content:"";position:absolute;top:8%;bottom:8%;right:0;width:1px;background:linear-gradient(180deg,transparent,rgba(201,162,39,.22),transparent)}
.beat{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:196px;padding:0 18px}
.beat .who{display:flex;align-items:center;justify-content:center;gap:15px;font-size:12px;letter-spacing:.24em;color:var(--muted)}
.beat .who b{color:var(--paper-dim);font-weight:400;letter-spacing:.18em;font-size:13.5px}
.beat .who .arrow{width:44px;height:1px;background:linear-gradient(90deg,rgba(201,162,39,.5),rgba(201,162,39,.1));position:relative}
.beat .who .arrow::after{content:"";position:absolute;right:0;top:-2.5px;width:5px;height:5px;border-top:1px solid var(--gold-dim);border-right:1px solid var(--gold-dim);transform:rotate(45deg)}
.beat .skill{font-size:clamp(36px,4.1vw,62px);font-weight:600;letter-spacing:.15em;color:#fbf3e2;line-height:1.14;text-shadow:0 2px 40px rgba(201,162,39,.3)}
.beat .skill.sm{font-size:clamp(26px,2.6vw,38px);letter-spacing:.2em}
.beat .tagline{display:flex;align-items:center;justify-content:center;gap:11px;font-size:10.5px;letter-spacing:.26em;color:var(--gold-dim)}
.beat .tagline .pill{border:1px solid rgba(201,162,39,.4);padding:3px 11px;color:var(--gold-2);letter-spacing:.22em;background:rgba(201,162,39,.06)}
.beat .tagline .pill.strategy{color:#a8cfc3;border-color:rgba(90,158,147,.45);background:rgba(90,158,147,.07)}
.beat .tagline .pill.heal{color:#bfd8ac;border-color:rgba(140,180,120,.42);background:rgba(140,180,120,.07)}
.beat .num{font-family:var(--num);font-size:88px;line-height:.9;font-weight:300;letter-spacing:.01em;color:var(--gold-2);text-shadow:0 0 54px rgba(201,162,39,.4);margin-top:2px}
.beat .num.neg{color:var(--crimson-2);text-shadow:0 0 54px rgba(168,50,44,.45)}
.beat .num small{font-size:15px;letter-spacing:.3em;color:var(--muted);margin-left:12px;font-family:var(--serif)}
.beat .detail{font-size:11.5px;letter-spacing:.1em;color:var(--muted);line-height:1.85;max-width:440px}
.beat .detail em{font-style:normal;color:var(--paper-dim);font-family:var(--num);font-size:13.5px;letter-spacing:.05em}
.bd-bars{display:flex;gap:6px;justify-content:center;margin-top:2px}
.bd-bars div{width:62px}
.bd-bars .lbl{font-size:8.5px;letter-spacing:.22em;color:var(--muted);margin-bottom:4px}
.bd-bars .val{height:3px;background:rgba(255,255,255,.09);position:relative;overflow:hidden}
.bd-bars .val i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6d33,#d6b354)}
.bd-bars .txt{font-family:var(--num);font-size:12px;color:var(--paper-dim);margin-top:3px;letter-spacing:.04em}

.stamp{position:absolute;left:50%;top:26%;width:270px;margin:-135px 0 0 -135px;opacity:.04;transform:rotate(-9deg);pointer-events:none;mix-blend-mode:screen;z-index:0}
.balance{width:100%;max-width:560px;flex:none;padding:14px 18px 4px;margin-top:6px;border-top:1px solid rgba(214,190,150,.12)}
.balance .nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.balance .nums b{font-family:var(--num);font-size:24px;font-weight:400;letter-spacing:.04em}
.balance .nums .r{color:#e8a99b}
.balance .nums .b{color:#a9c3e6}
.balance .nums span{font-size:8.5px;letter-spacing:.28em;color:var(--muted);margin:0 6px}
.balance .track{height:6px;display:flex;background:rgba(255,255,255,.05);position:relative;overflow:hidden}
.balance .track i{height:100%;transition:width .6s var(--ease)}
.balance .track .r{background:linear-gradient(90deg,#5e2620,#c04a38)}
.balance .track .b{background:linear-gradient(90deg,#2b3c56,#5b7fae)}
.balance .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(242,232,212,.5)}

.ticker{width:100%;max-width:560px;flex:none;margin-top:10px;padding:0 18px;height:78px;overflow:hidden}
.ticker .row>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ticker .row{display:flex;align-items:baseline;gap:10px;font-size:11px;letter-spacing:.05em;color:rgba(203,184,150,.55);padding:4px 0;border-top:1px solid rgba(214,190,150,.07);white-space:nowrap;overflow:hidden;animation:slidein .5s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ticker .row .rnd{font-family:var(--num);font-size:9.5px;color:var(--gold-dim);letter-spacing:.1em;flex:none}
.ticker .row b{color:var(--paper-dim);font-weight:400}
.ticker .row .sk{color:var(--gold-2)}
.ticker .row .dmg{font-family:var(--num);font-size:12px;color:#d4695a}
.ticker .row .heal{font-family:var(--num);font-size:12px;color:#9dc08a}

/* ── 年代轴 ── */

<script>
(() => {
  const B = window.BATTLE;
  const U = Object.fromEntries(B.units.map(u => [u.id, u]));
  const RED = B.units.filter(u => u.side === 'red');
  const BLUE = B.units.filter(u => u.side === 'blue');
  const RESULT = { win: '胜局', loss: '败局', draw: '平局' };
  const TROOP = { cavalry: '骑兵', archer: '弓兵', infantry: '步兵' };
  const DOT = { sorcery:'妖术', burning:'燃烧', panic:'恐慌', curse:'诅咒', ignite:'引燃', unrest:'逃兵' };
  const STATUS = { damage_boost:'增伤', damage_reduce:'减伤', combo:'连击', split:'分兵', confusion:'混乱', rampage:'暴走', fear:'怯战', hesitation:'犹豫',
    silence:'犹豫', first_aid:'急救', rest:'休整', evasion:'规避', cover:'援护', taunt:'挑衅', morale_boost:'士气', morale_debuff:'士气',
    attack_buff:'攻击提高', defense_buff:'防御提高', strategy_buff:'谋略提高', speed_buff:'速度提高',
    attack_debuff:'攻击降低', defense_debuff:'防御降低', strategy_debuff:'谋略降低', speed_debuff:'速度降低',
    ignite:'引燃', curse:'诅咒', ignore_evasion:'无视规避', redirect:'承担', control_immune:'洞察', dot:'持续伤害' };

  const fmt = n => Math.round(n).toLocaleString('en-US');
  const nm = id => (U[id] ? U[id].name : '—');
  const sideCls = id => (U[id] && U[id].side === 'blue' ? 'bl' : 'rd');
  const $ = s => document.querySelector(s);

  // ── 逐事件兵力帧 ──
  const frames = [];
  let live = { red: RED.map(u => u.maxTroops), blue: BLUE.map(u => u.maxTroops) };
  const slotIdx = id => ['大营','中军','前锋'].indexOf(U[id].slot);
  B.events.forEach(e => {
    if (e.t === 'round_start' && e.snap) live = { red: e.snap.my.slice(), blue: e.snap.enemy.slice() };
    if (['damage','attack','dot','split'].includes(e.t) && e.after != null) {
      const u = U[e.to]; if (u) live[u.side][slotIdx(e.to)] = e.after;
    }
    if (e.t === 'heal' && e.after != null) {
      const u = U[e.to]; if (u) live[u.side][slotIdx(e.to)] = e.after;
    }
    if (e.t === 'round_end') live = { red: e.my.slice(), blue: e.enemy.slice() };
    frames.push({ red: live.red.slice(), blue: live.blue.slice() });
  });

  // ── 节拍 ──
  const scoreOf = e => {
    if (e.t === 'cast') return 7;
    if (e.t === 'attack') return 6;
    if (e.t === 'damage') return e.dmg >= 400 ? 7 : e.dmg >= 180 ? 4 : 2;
    if (e.t === 'split') return 4;
    if (e.t === 'heal') return e.amount >= 300 ? 4 : 2;
    if (e.t === 'trigger') return e.ok ? 2 : 1;
    if (e.t === 'cover' || e.t === 'evade' || e.t === 'conflict') return 3;
    if (e.t === 'status') return 1;
    if (e.t === 'dot') return 2;
    if (e.t === 'changed' || e.t === 'idle') return 1;
    return 0;
  };
  const byRound = new Map();
  B.events.forEach((e, i) => {
    if (e.t === 'round_start' || e.t === 'round_end') return;
    if (!byRound.has(e.round)) byRound.set(e.round, []);
    byRound.get(e.round).push({ e, i, s: scoreOf(e) });
  });
  const beats = [];
  for (const r of [...byRound.keys()].sort((a, b) => a - b)) {
    byRound.get(r).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 16).sort((a, b) => a.i - b.i)
      .forEach(x => beats.push(x));
  }
  let bi = 0, playing = false, timer = null, hist = [];

  // ── 卡面 ──
  function cardHTML(u) {
    const redDots = Array.from({ length: u.redness || 0 }, () => '<i></i>').join('');
    return `<div class="card" data-id="${u.id}" tabindex="0">
      <div class="pic"><img src="${u.portrait}" alt="${u.name}" loading="lazy"></div>
      <div class="body">
        <div class="l1">
          <span class="pos">${u.slot}</span>
          <span class="fac" title="${u.factionLabel}"><img src="${u.factionIcon}" alt="${u.factionLabel}"></span>
        </div>
        <div class="l2"><b>${u.name}</b><i>${u.secondaryTroop || TROOP[u.troopType] || u.troopType}</i></div>
        <div class="perf"><span>造成<b>${fmt(u.agg.dealt)}</b></span><span>承受<b>${fmt(u.agg.taken)}</b></span></div>
        <div class="l3">
          <div class="troops"><b data-troops="${u.id}">${fmt(u.maxTroops)}</b><span>/ ${fmt(u.maxTroops)}</span></div>
          <div class="bar" data-bar="${u.id}"><i class="t" style="width:100%"></i><i class="w" style="width:0"></i><i class="d" style="width:0"></i></div>
          <div class="cas"><span>伤 <b data-w="${u.id}">${fmt(u.wounded)}</b></span><span>亡 <b data-d="${u.id}">${fmt(u.dead)}</b></span></div>
          <div class="mini">
            ${u.extraSkills.slice(0, 4).map(s => `<img src="../public/skills/skill-type-${s.type}.png" title="${s.name}" alt="">`).join('')}
            <span class="red" title="${u.redness} 红">${redDots}</span>
          </div>
        </div>
      </div>
    </div>`;
  }
  function headHTML(side) {
    const name = side === 'red' ? B.meta.redName : B.meta.blueName;
    const tag = side === 'red' ? B.meta.redTag : B.meta.blueTag;
    return `<div class="side-head"><div class="who"><em>${side === 'red' ? '红' : '蓝'}方</em>${name}</div><div class="tag">${tag}</div></div>`;
  }
  const footHTML = side => `<div class="side-foot"><span>总兵力</span><b data-total="${side}">30,000</b></div>`;

  $('#redSide').innerHTML = headHTML('red') + RED.map(cardHTML).join('') + footHTML('red');
  $('#blueSide').innerHTML = headHTML('blue') + BLUE.map(cardHTML).join('') + footHTML('blue');

  function paintTroops(side, arr, totals) {
    const list = side === 'red' ? RED : BLUE;
    list.forEach((u, i) => {
      const t = Math.max(0, arr[i]);
      const el = document.querySelector(`[data-troops="${u.id}"]`);
      if (el) { el.textContent = fmt(t); el.classList.toggle('low', t / u.maxTroops < 0.25); }
      const bar = document.querySelector(`[data-bar="${u.id}"]`);
      if (bar) {
        const w = u.wounded || 0, d = u.dead || 0;
        const total = Math.max(u.maxTroops, t + w + d);
        bar.children[0].style.width = (t / total * 100) + '%';
        bar.children[1].style.width = (w / total * 100) + '%';
        bar.children[2].style.width = (d / total * 100) + '%';
      }
      const card = document.querySelector(`.card[data-id="${u.id}"]`);
      if (card) card.classList.toggle('dead', t <= 0);
    });
    const te = document.querySelector(`[data-total="${side}"]`);
    if (te) te.textContent = fmt(totals);
  }

  // ── 回合轴 ──
  const ROUNDS = B.series.filter(s => s.round > 0);
  const axisX = i => 8 + (i / (ROUNDS.length - 1)) * 784;
  const AXIS = (() => {
    const vals = ROUNDS.flatMap(s => [s.my.reduce((a, b) => a + b, 0), s.enemy.reduce((a, b) => a + b, 0)]);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return { lo: Math.max(0, lo - (hi - lo) * 0.35), hi: hi + (hi - lo) * 0.18 };
  })();
  const axisY = v => 59 - ((v - AXIS.lo) / Math.max(1, AXIS.hi - AXIS.lo)) * 50;
  function buildTicks() {
    const rr = ROUNDS.map(s => s.my.reduce((a, b) => a + b, 0));
    const bb = ROUNDS.map(s => s.enemy.reduce((a, b) => a + b, 0));
    const line = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${axisX(i).toFixed(1)} ${axisY(v).toFixed(1)}`).join(' ');
    const area = arr => line(arr) + ` L792 59 L8 59 Z`;
    $('#axisLineR').setAttribute('d', line(rr));
    $('#axisLineB').setAttribute('d', line(bb));
    $('#axisAreaR').setAttribute('d', area(rr));
    $('#axisDots').innerHTML = rr.map((v, i) => `<circle class="dot r" cx="${axisX(i).toFixed(1)}" cy="${axisY(v).toFixed(1)}" r="2.4"/>`).join('')
      + bb.map((v, i) => `<circle class="dot b" cx="${axisX(i).toFixed(1)}" cy="${axisY(v).toFixed(1)}" r="2.4"/>`).join('');
    $('#axisAreaB').setAttribute('d', area(bb));
    const wrap = $('#labs');
    wrap.innerHTML = ROUNDS.map(s => `<button data-round="${s.round}">${String(s.round).padStart(2, '0')}</button>`).join('');
    wrap.querySelectorAll('button').forEach(t => t.addEventListener('click', () => {
      const rd = +t.dataset.round;
      const idx = beats.findIndex(b => b.e.round === rd);
      stop(); setBeat(idx < 0 ? 0 : idx, false);
    }));
  }
  function paintTicks() {
    const rd = beats[bi] ? beats[bi].e.round : 1;
    document.querySelectorAll('#labs button').forEach(t => {
      const r = +t.dataset.round;
      t.classList.toggle('on', r === rd);
      t.classList.toggle('passed', r < rd);
    });
    const ph = $('#axisPh');
    if (ph) { const x = axisX(Math.max(0, rd - 1)); ph.setAttribute('x1', x); ph.setAttribute('x2', x); }
    $('#roundNum').textContent = String(rd).padStart(2, '0');
    $('#roundSub').textContent = `共 ${B.series.length - 1} 回合 · ${RESULT[B.meta.result]} · 种子 ${B.meta.seed}`;
  }

  // ── 出手序 ──
  const roundStart = new Map();
  B.events.forEach(e => { if (e.t === 'round_start') roundStart.set(e.round, e.turnOrder || []); });
  function paintOrder(round, actorId) {
    const order = roundStart.get(round) || [];
    $('#order').innerHTML = '<span class="olabel">出 手 序</span>' + order.map((id, k) => {
      const u = U[id] || {};
      return `${k ? '<span class="arrowmark"></span>' : ''}
        <span class="who ${u.side === 'blue' ? 'blue' : ''} ${id === actorId ? 'on' : ''}" title="${u.name || id}">
          <img src="${u.avatar || u.portrait || ''}" alt=""><em>${u.speed ?? ''}</em></span>`;
    }).join('');
  }

  // ── 中央节拍 ──
  function breakdownHTML(bd) {
    if (!bd) return '';
    const parts = [['兵力', bd.troopBase], ['属性', bd.base], ['主加成', bd.main]].filter(p => p[1] != null && p[1] !== 0);
    if (!parts.length) return '';
    const max = Math.max(...parts.map(p => p[1]), 1);
    return `<div class="bd-bars">${parts.map(([k, v]) => `
      <div><div class="lbl">${k}</div><div class="val"><i style="width:${v / max * 100}%"></i></div><div class="txt">${v}</div></div>`).join('')}</div>`;
  }
  function beatHTML(e) {
    const who = (a, b) => `<div class="who"><b>${nm(a)}</b>${b ? '<span class="arrow"></span>' : ''}${b ? `<b>${nm(b)}</b>` : ''}</div>`;
    switch (e.t) {
      case 'cast': return `${who(e.id)}<div class="skill">${e.skill}</div>
        <div class="tagline"><span class="pill">战法发动</span><span>判定成功</span></div>`;
      case 'attack': return `${who(e.from, e.to)}<div class="skill sm">普通攻击</div>
        <div class="num neg">−${e.dmg}<small>兵力</small></div>
        <div class="detail">双方距离 <em>${e.dist ?? '—'}</em> · 攻击伤害</div>`;
      case 'damage': {
        const isStr = e.kind === 'strategy';
        return `${who(e.from, e.to)}<div class="skill">${e.skill || '战法伤害'}</div>
          <div class="tagline"><span class="pill ${isStr ? 'strategy' : ''}">${isStr ? '谋略伤害' : '攻击伤害'}</span></div>
          <div class="num neg">−${e.dmg}<small>兵力</small></div>${breakdownHTML(e.bd)}`;
      }
      case 'dot': return `${who(e.from, e.to)}<div class="skill sm">${DOT[e.kind] || '持续伤害'}</div>
        <div class="tagline"><span class="pill strategy">${e.skill || '持续效果'}</span></div>
        <div class="num neg">−${e.dmg}<small>兵力</small></div>`;
      case 'split': return `${who(e.from, e.to)}<div class="skill sm">分兵</div>
        <div class="tagline"><span class="pill">${e.skill || '分兵溅射'}</span></div>
        <div class="num neg">−${e.dmg}<small>兵力</small></div>`;
      case 'heal': return `${who(e.id, e.to)}<div class="skill sm">${e.skill || '兵力恢复'}</div>
        <div class="num">+${e.amount}<small>兵力</small></div>
        <div class="detail">恢复前 <em>${fmt(e.before)}</em> → 恢复后 <em>${fmt(e.after)}</em></div>`;
      case 'trigger': return `${who(e.id)}<div class="skill">${e.skill}</div>
        <div class="tagline"><span class="pill ${e.ok ? '' : 'strategy'}">${e.ok ? '判定成功' : '判定落空'}</span></div>
        <div class="detail">当前生效几率 <em>${e.rate ?? '—'}%</em>${e.baseRate ? ` = ${e.baseRate}% × 士气系数 ${e.morale === 120 ? '1.12' : '1'}` : ''}</div>`;
      case 'status': return `${who(e.id)}<div class="skill sm">${STATUS[e.kind] || '状态'}</div>
        <div class="detail">${e.detail || ''}</div>`;
      case 'cover': return `${who(e.id, e.to)}<div class="skill sm">援护</div>
        <div class="detail">${nm(e.id)} 代为承受原本落在 ${nm(e.to)} 身上的普通攻击</div>`;
      case 'evade': return `${who(e.id)}<div class="skill sm">规避</div>
        <div class="detail">来自 ${nm(e.from)} 的攻击被规避，未造成伤害</div>`;
      case 'conflict': return `${who(e.id)}<div class="skill sm">状态冲突</div>
        <div class="detail">${e.detail || ''}</div>`;
      case 'idle': return `${who(e.id)}<div class="skill sm">未能行动</div>
        <div class="detail">${e.reason || ''}</div>`;
      case 'changed': return `${who(e.id)}<div class="skill sm">状态变更</div>
        <div class="detail">${e.detail || ''}</div>`;
      default: return `${who(e.id || e.from)}<div class="skill sm">${e.t}</div>`;
    }
  }

  function histLine(e) {
    switch (e.t) {
      case 'cast': return `${nm(e.id)} 发动 ${e.skill}`;
      case 'attack': return `${nm(e.from)} 普攻 ${nm(e.to)} −${e.dmg}`;
      case 'damage': return `${nm(e.from)} ${e.skill || '伤害'} → ${nm(e.to)} −${e.dmg}`;
      case 'dot': return `${nm(e.from)} ${DOT[e.kind] || '持续'} → ${nm(e.to)} −${e.dmg}`;
      case 'split': return `${nm(e.from)} 分兵 → ${nm(e.to)} −${e.dmg}`;
      case 'heal': return `${nm(e.id)} ${e.skill || '恢复'} → ${nm(e.to)} +${e.amount}`;
      case 'trigger': return `${nm(e.id)} 判定 ${e.skill} ${e.ok ? '成功' : '落空'}`;
      case 'status': return `${nm(e.id)} ${STATUS[e.kind] || ''}`;
      case 'cover': return `${nm(e.id)} 援护 ${nm(e.to)}`;
      case 'evade': return `${nm(e.id)} 规避 ${nm(e.from)} 的攻击`;
      default: return null;
    }
  }
  function paintRoundStat(b) {
    const rd = b.e.round;
    let r = 0, bl = 0, dead = 0;
    for (let i = 0; i <= b.i && i < B.events.length; i++) {
      const e = B.events[i];
      if (e.round !== rd) continue;
      if (['damage','attack','dot','split'].includes(e.t)) {
        const u = U[e.from]; if (!u) continue;
        if (u.side === 'red') r += e.dmg || 0; else bl += e.dmg || 0;
      }
      if (e.t === 'damage' && e.after === 0) dead++;
    }
    const el = $('#rstat');
    if (!el) return;
    el.innerHTML = `<span>本回合累计</span><i></i><span>红方输出<b class="r">${fmt(r)}</b></span>
      <i></i><span>蓝方输出<b class="b">${fmt(bl)}</b></span><i></i><span>达成斩将<b>${dead}</b></span>`;
  }
  function paintBalance(f) {
    const r = f.red.reduce((a, b) => a + b, 0);
    const b = f.blue.reduce((a, b) => a + b, 0);
    $('#balRed').textContent = fmt(r);
    $('#balBlue').textContent = fmt(b);
    const total = Math.max(1, r + b);
    $('#balBarR').style.width = (r / total * 100) + '%';
    $('#balBarB').style.width = (b / total * 100) + '%';
  }

  function paintTicker(idx) {
    const rows = [];
    for (let i = idx; i >= 0 && rows.length < 3; i--) {
      const e = B.events[i];
      if (!e || e.t === 'round_start' || e.t === 'round_end') continue;
      const line = feedLine(e, true);
      if (!line) continue;
      rows.push(`<div class="row"><span class="rnd">${String(e.round).padStart(2, '0')}</span><div>${line}</div></div>`);
    }
    $('#ticker').innerHTML = rows.join('');
  }

  function setBeat(i, autoScroll = true) {
    if (!beats.length) return;
    bi = Math.max(0, Math.min(beats.length - 1, i));
    const b = beats[bi];
    const hl = histLine(b.e);
    if (hl) hist.push(hl);
    if (hist.length > 6) hist.shift();
    const f = frames[b.i] || frames[frames.length - 1];
    paintTroops('red', f.red, f.red.reduce((a, c) => a + c, 0));
    paintTroops('blue', f.blue, f.blue.reduce((a, c) => a + c, 0));
    paintTicks();
    paintOrder(b.e.round, b.e.from ?? b.e.id);
    paintBalance(f);

    const actor = b.e.from ?? b.e.id;
    const el = $('#beat');
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    requestAnimationFrame(() => {
      el.innerHTML = beatHTML(b.e);
      el.style.transition = 'opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1)';
      el.style.opacity = '1';
      el.style.transform = 'none';
    });

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    [actor, b.e.to].forEach(id => { const c = document.querySelector(`.card[data-id="${id}"]`); if (c) c.classList.add('active'); });
    if (b.e.to && b.e.dmg) {
      const c = document.querySelector(`.card[data-id="${b.e.to}"]`);
      if (c) { c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit'); }
    }
    paintRoundStat(b);
    if (autoScroll) highlightFeed(b.i);
  }

  // ── 实录 ──
  function feedLine(e, short) {
    const m = v => `<b class="${sideCls(v)}">${nm(v)}</b>`;
    switch (e.t) {
      case 'act': return short ? null : `${m(e.id)} <span class="mut">行动 · ${e.pos}</span>`;
      case 'cast': return `${m(e.id)} 发动 <span class="sk">${e.skill}</span>`;
      case 'trigger': return `${m(e.id)} 判定 <span class="sk">${e.skill}</span> <span class="mut">${e.rate ?? ''}%</span> ${e.ok ? '成功' : '<span class="mut">落空</span>'}`;
      case 'attack': return `${m(e.from)} 普攻 ${m(e.to)} <span class="dmg">−${e.dmg}</span>`;
      case 'damage': return `${m(e.from)} <span class="sk">${e.skill || ''}</span> → ${m(e.to)} <span class="dmg">−${e.dmg}</span>`;
      case 'dot': return `${m(e.from)} ${DOT[e.kind] || '持续'} → ${m(e.to)} <span class="dmg">−${e.dmg}</span>`;
      case 'split': return `${m(e.from)} 分兵 → ${m(e.to)} <span class="dmg">−${e.dmg}</span>`;
      case 'heal': return `${m(e.id)} <span class="sk">${e.skill || ''}</span> → ${m(e.to)} <span class="heal">+${e.amount}</span>`;
      case 'status': return `${m(e.id)} <span class="mut">${e.detail || STATUS[e.kind] || e.kind}</span>`;
      case 'expire': return `${m(e.id)} <span class="mut">${STATUS[e.kind] || e.kind} 结束</span>`;
      case 'changed': return `${m(e.id)} <span class="mut">${e.detail || ''}</span>`;
      case 'conflict': return `${m(e.id)} <span class="mut">${e.detail || '状态冲突'}</span>`;
      case 'cover': return `${m(e.id)} 援护 ${m(e.to)}`;
      case 'evade': return `${m(e.id)} <span class="mut">规避了 ${nm(e.from)} 的攻击</span>`;
      case 'idle': return `${m(e.id)} <span class="mut">${e.reason || '无法行动'}</span>`;
      case 'death': return `${m(e.id)} 阵亡`;
      case 'target': return e.detail ? `${m(e.id)} <span class="mut">${e.detail}</span>` : null;
      default: return null;
    }
  }
  function buildFeed() {
    const ul = $('#feed');
    let html = '';
    B.events.forEach((e, i) => {
      if (e.t === 'round_start') { html += `<li class="sep"><span>第 ${String(e.round).padStart(2,'0')} 回合</span></li>`; return; }
      if (e.t === 'round_end' || e.t === 'end') return;
      const line = feedLine(e);
      if (!line) return;
      html += `<li data-i="${i}"><div class="rnd">${String(e.round).padStart(2,'0')}</div><div class="txt">${line}</div></li>`;
    });
    ul.innerHTML = html;
    ul.querySelectorAll('li[data-i]').forEach(li => li.addEventListener('click', () => {
      const i = +li.dataset.i;
      const idx = beats.findIndex(b => b.i >= i);
      stop(); setBeat(idx < 0 ? beats.length - 1 : idx, false); highlightFeed(i);
    }));
  }
  let lastFeed = null;
  function highlightFeed(i) {
    if (lastFeed) lastFeed.classList.remove('on');
    const ul = $('#feed'); if (!ul) return;
    const target = ul.querySelector(`li[data-i="${i}"]`);
    if (!target) return;
    target.classList.add('on'); lastFeed = target;
    const body = ul.parentElement;
    const r = target.getBoundingClientRect(), br = body.getBoundingClientRect();
    if (r.top < br.top + 24 || r.bottom > br.bottom - 24) body.scrollTop += r.top - br.top - br.height / 2 + r.height / 2;
  }

  // ── 抽屉面板 ──
  function buildLedger() {
    const max = Math.max(...B.units.map(u => u.agg.dealt), 1);
    $('#ledger').innerHTML = B.units.map(u => `
      <div class="row">
        <div class="h"><b>${u.name}</b><span>${fmt(u.agg.dealt)} 伤害 · ${fmt(u.agg.taken)} 承伤</span></div>
        <div class="track"><i style="width:${u.agg.dealt / max * 100}%"></i></div>
      </div>`).join('') +
      `<div class="legend"><span><i style="background:#c9a227"></i>造成伤害</span></div>
      <div style="margin-top:16px;border-top:1px solid rgba(214,190,150,.12);padding-top:12px">
        ${B.units.map(u => `<div class="kpi-row"><span>${u.name} · 恢复</span><b>${fmt(u.agg.healed)}</b></div>`).join('')}
      </div>`;
  }
  function buildSkills() {
    const list = B.skillAgg.filter(s => s.damage > 0 || s.heal > 0 || s.casts > 0);
    const max = Math.max(...list.map(s => s.damage), 1);
    $('#skTable').innerHTML = `<thead><tr><th>战法</th><th>发动</th><th>伤害</th><th>恢复</th></tr></thead><tbody>
      ${list.map(s => `<tr class="${s.system ? 'system' : ''}">
        <td>${s.name}<span class="micro"><i style="width:${s.damage / max * 100}%"></i></span></td>
        <td>${s.casts || '—'}</td><td>${s.damage ? fmt(s.damage) : '—'}</td><td>${s.heal ? fmt(s.heal) : '—'}</td>
      </tr>`).join('')}</tbody>`;
  }

  // ── 档案 ──
  const dossier = $('#dossier');
  function openDossier(id, anchor) {
    const u = U[id]; if (!u) return;
    const a = u.agg;
    dossier.innerHTML = `
      <div class="ph"><img src="${u.portrait}" alt="">
        <div><h4>${u.name}</h4>
          <p>${u.factionLabel} · ${u.secondaryTroop || TROOP[u.troopType] || u.troopType}<br>
          ${u.slot} · ${u.level} 级 · ${u.redness} 红 · 士气 ${u.morale}</p>
          <p style="margin-top:7px;color:var(--gold-dim)">${(u.traits || []).join(' · ')}</p></div></div>
      <div class="stats">
        <div><span>攻击</span><b>${u.attack}</b></div><div><span>防御</span><b>${u.defense}</b></div>
        <div><span>谋略</span><b>${u.strategy}</b></div><div><span>速度</span><b>${u.speed}</b></div></div>
      <div class="list">
        <h5>战 法</h5>
        <div class="sk"><img src="../public/skills/skill-type-command.png" alt="">${u.mainSkill.name}<span style="color:var(--gold-dim);font-size:10px;margin-left:auto">主</span></div>
        ${u.extraSkills.filter(s => s.id !== u.mainSkill.id).map(s => `<div class="sk"><img src="../public/skills/skill-type-${s.type}.png" alt="">${s.name}</div>`).join('')}
        <h5>本 局 战 绩</h5>
        <div class="kpi-row"><span>造成伤害</span><b>${fmt(a.dealt)}</b></div>
        <div class="kpi-row"><span>承受伤害</span><b>${fmt(a.taken)}</b></div>
        <div class="kpi-row"><span>恢复兵力</span><b>${fmt(a.healed)}</b></div>
        <div class="kpi-row"><span>战法发动</span><b>${a.casts}</b></div>
        <h5>兵 力</h5>
        <div class="kpi-row"><span>终局兵力 / 上限</span><b>${fmt(u.troops)} / ${fmt(u.maxTroops)}</b></div>
        <div class="kpi-row"><span>伤兵 · 阵亡</span><b>${fmt(u.wounded)} · ${fmt(u.dead)}</b></div>
      </div>`;
    const r = anchor.getBoundingClientRect();
    let x = r.right + 16; if (x + 346 > innerWidth) x = r.left - 362;
    const y = Math.min(Math.max(14, r.top - 28), innerHeight - 540);
    dossier.style.left = x + 'px'; dossier.style.top = y + 'px';
    dossier.classList.add('on');
  }
  document.querySelectorAll('.card').forEach(c => c.addEventListener('click', ev => { ev.stopPropagation(); openDossier(c.dataset.id, c); }));
  document.addEventListener('click', e => { if (!dossier.contains(e.target)) dossier.classList.remove('on'); });

  // ── 播放 ──
  const playIcon = $('#playIcon');
  const paintPlay = () => { playIcon.innerHTML = playing ? '<rect x="2" y="1" width="3.4" height="12"/><rect x="8.6" y="1" width="3.4" height="12"/>' : '<path d="M2 1l10 6-10 6z"/>'; };
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(() => { if (playing) step(); }, ms); }
  function step() {
    if (bi + 1 >= beats.length) { stop(); return; }
    const r0 = beats[bi].e.round, r1 = beats[bi + 1].e.round;
    setBeat(bi + 1);
    schedule(r1 !== r0 ? 1600 : 800);
  }
  function play() { if (bi >= beats.length - 1) setBeat(0); playing = true; paintPlay(); step(); }
  function stop() { playing = false; clearTimeout(timer); paintPlay(); }
  $('#playBtn').addEventListener('click', () => playing ? stop() : play());
  $('#prevRound').addEventListener('click', () => {
    const rd = beats[bi] ? beats[bi].e.round : 1;
    const idx = beats.findIndex(b => b.e.round === Math.max(1, rd - 1)); stop(); setBeat(idx < 0 ? 0 : idx);
  });
  $('#nextRound').addEventListener('click', () => {
    const rd = beats[bi] ? beats[bi].e.round : 1;
    const idx = beats.findIndex(b => b.e.round === Math.min(B.series.length - 1, rd + 1)); stop(); setBeat(idx < 0 ? beats.length - 1 : idx);
  });
  $('#replayBtn').addEventListener('click', () => { stop(); setBeat(0); setTimeout(play, 200); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
    if (e.key === 'ArrowRight') { stop(); setBeat(bi + 1); }
    if (e.key === 'ArrowLeft') { stop(); setBeat(bi - 1); }
  });

  const drawer = $('#drawer');
  $('#drawerBtn').addEventListener('click', () => {
    drawer.classList.toggle('open');
    if (drawer.classList.contains('open')) setTimeout(() => highlightFeed(beats[bi].i), 480);
  });
  $('#drawerClose').addEventListener('click', () => drawer.classList.remove('open'));
  document.querySelectorAll('.drawer-tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.drawer-tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
    $('#p-' + b.dataset.tab).classList.add('on');
  }));

  buildTicks(); buildFeed(); buildLedger(); buildSkills();
  setBeat(0); paintPlay();
  setTimeout(() => { if (!drawer.classList.contains('open')) play(); }, 900);
})();
</script>
</body>
</html>
